name: DevSecOps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/venkat-devsecops-demo

jobs:
  test-and-scan:
    name: Test and source security checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: false

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Optional: configure SONAR_TOKEN and SONAR_HOST_URL in repository secrets.
      # SonarQube/SonarCloud analysis can be added after creating a project there.
      - name: Build Docker image
        run: docker build -t local/venkat-devsecops-demo:${{ github.sha }} .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/venkat-devsecops-demo:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  publish-and-deploy:
    name: Publish image and deploy
    needs: test-and-scan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      # Configure these repository secrets only when you are ready to deploy to EC2:
      # EC2_HOST, EC2_USER, EC2_SSH_KEY. EC2 must have Docker installed and SSH allowed
      # from GitHub-hosted runners (prefer a self-hosted runner or restricted network access).
      - name: Deploy to EC2 over SSH
        if: ${{ env.EC2_HOST != '' && env.EC2_USER != '' && env.EC2_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}
            docker stop venkat-devsecops-demo || true
            docker rm venkat-devsecops-demo || true
            docker run -d --restart unless-stopped --name venkat-devsecops-demo -p 80:3000 ${{ env.IMAGE_NAME }}:${{ github.sha }}
            sleep 5
            curl --fail http://localhost/health

      - name: Slack notification
        if: ${{ always() && env.SLACK_WEBHOOK_URL != '' }}
        env:
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            EMOJI=":white_check_mark:"
          else
            EMOJI=":x:"
          fi
          payload=$(printf '{"text":"%s CI/CD job *%s* for `%s` at `%.7s`. <%s|View workflow run>"}' "$EMOJI" "$JOB_STATUS" "$REPO" "$COMMIT_SHA" "$RUN_URL")
          curl --fail --silent --show-error -X POST -H 'Content-type: application/json' \
            --data "$payload" "$SLACK_WEBHOOK_URL"
