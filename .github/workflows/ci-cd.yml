
name: Docker Hub Login Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test-login:
    runs-on: ubuntu-latest

    steps:
      - name: Test Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify Docker Login
        run: docker info
