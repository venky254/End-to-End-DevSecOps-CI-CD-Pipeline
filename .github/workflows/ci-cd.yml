
name: DevSecOps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-scan:
    name: Test and Security Checks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build local Docker image
        run: |
          docker build \
            -t local/venkat-devsecops-demo:${{ github.sha }} .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: local/venkat-devsecops-demo:${{ github.sha }}
          scan-type: image
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          timeout: 5m
          exit-code: "0"

  publish:
    name: Publish Docker Image
    needs: test-and-scan
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      
      -
      - name: Diagnose Docker Hub username
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "RESULT: Username is empty or unavailable"
            exit 1
          fi

          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "RESULT: Token is empty or unavailable"
            exit 1
          fi

          echo "RESULT: Both secrets are available"
          echo "Username length: ${#DOCKERHUB_USERNAME}"
          echo "Username contains whitespace:"
          if [[ "$DOCKERHUB_USERNAME" =~ [[:space:]] ]]; then
            echo "Yes"
          else
            echo "No"
          fi

        

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/venkat-devsecops-demo:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/venkat-devsecops-demo:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Slack notification
        if: ${{ always() }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu

          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "Slack webhook is not configured. Skipping notification."
           